name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ["py311", "py312", "py313", "py314"]
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.77.1
          environments: ${{ matrix.environment }}
          cache: true
      - name: Check package
        run: pixi run --environment ${{ matrix.environment }} check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.77.1
          cache: true
      - name: Build Python distributions
        run: pixi run build
      - name: Build Conda package
        run: pixi build --output-dir dist/conda
