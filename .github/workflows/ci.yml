name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: 🟨 Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.1

      - name: 🧹 Execute lint
        run: pixi run lint
  test:
    name: Test 🐍 ${{ matrix.environment }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        environment: ["py311", "py312", "py313", "py314"]
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: 🟨 Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: ${{ matrix.environment }}
          cache: true
      - name: 🧪 Test package
        run: pixi run --environment ${{ matrix.environment }} test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 🟨 Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          cache: true
      - name: Build Python distributions
        run: pixi run build
      - name: Build Conda package
        run: pixi build --output-dir dist/conda
