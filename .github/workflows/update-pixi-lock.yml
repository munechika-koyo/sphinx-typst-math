name: Update Pixi lock file

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - name: Update lock file
        run: |
          set -o pipefail
          pixi update --json | pixi exec pixi-diff-to-markdown > pixi-update.md
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update Pixi lock file
          title: Update Pixi lock file
          body-path: pixi-update.md
          branch: dependencies/pixi-lock
          base: main
          delete-branch: true
          add-paths: pixi.lock
