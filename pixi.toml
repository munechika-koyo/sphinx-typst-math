[workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]
preview = ["pixi-build"]

# -------------------------------
# === Packaging Configuration ===
# -------------------------------
[package]
version = "dynamic"  # TODO: Get the version from git tags

[package.build]
backend = {
  name = "pixi-build-python",
  version = "*",
}

[package.host-dependencies]
python = "*"
hatchling = ">=1.26"
hatch-vcs = "*"

[package.run-dependencies]
sphinx = ">=8.2,<10"
packaging = ">=23"
typst-py = ">=0.15"

# ---------------------------------
# === Development Configuration ===
# ---------------------------------
[dependencies]
sphinx-typst-math = { path = "." }

# Type stubs
types-docutils = ">=0.21"

# For testing
pytest = ">=8,<9"
pandoc = ">=3,<4"
myst-parser = ">=4,<6"
nbsphinx = ">=0.9.7,<1"
sphinx-immaterial = ">=0.13,<1"

# For building and packaging
python-build = "*"

# For linting and formatting
lefthook = "*"
dprint = "*"
ruff = "*"
pyrefly = "*"
actionlint = "*"
shellcheck = "*"
validate-pyproject = "*"
tombi = "*"

[tasks]
# Test task
test = { cmd = "pytest", description = "🧪 Run tests with pytest" }

# Linting and formatting tasks
lefthook = { cmd = "lefthook", description = "🔗 Run lefthook" }
hooks = { cmd = "lefthook install", description = "🔗 Install pre-commit hooks" }
pre-commit = { cmd = "lefthook run pre-commit", description = "🔗 Run pre-commit checks" }
pyrefly-check = { cmd = "pyrefly check", description = "Type check with pyrefly" }
ruff-check = { cmd = "ruff check --fix", description = "Lint with ruff" }
ruff-format = { cmd = "ruff format", description = "Format with ruff" }
toml-format = { cmd = "tombi format", description = "Format TOML files" }
dprint = { cmd = "dprint fmt", description = "Format with dprint" }
actionlint = { cmd = "actionlint", description = "Lint actions with actionlint" }
blacken-docs = { cmd = "blacken-docs", description = "Format Python markdown blocks with Black" }
validate-pyproject = { cmd = "validate-pyproject pyproject.toml", description = "Validate pyproject.toml" }
lint = { cmd = "lefthook run pre-commit --all-files --force", description = "🧹 Run all linters" }

# Build and packaging tasks
build = { cmd = "python -m build", description = "📦 Build the package" }

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = ["py313"]
py311 = ["py311"]
py312 = ["py312"]
py313 = ["py313"]
py314 = ["py314"]
