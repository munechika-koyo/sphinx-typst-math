[project]
name = "sphinx-typst-math"
description = "Render native Typst math as MathML in Sphinx HTML builds"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "munechika-koyo", email = "munechika.koyo@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Sphinx :: Extension",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation :: Sphinx",
]
dependencies = [
  "Sphinx>=8.2,<10",
  "packaging>=23",
  "typst>=0.15",
]
dynamic = ["version"]

[project.urls]
Issues = "https://github.com/munechika-koyo/sphinx-typst-math/issues"
Repository = "https://github.com/munechika-koyo/sphinx-typst-math"

[build-system]
requires = ["hatch-vcs", "hatchling>=1.26"]
build-backend = "hatchling.build"

# -------------------------------
# === Packaging Configuration ===
# -------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_typst_math"]

# ----------------------
# === Version config ===
# ----------------------
[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata.hooks.vcs]

# ------------------------------
# === Type checking settings ===
# ------------------------------
[tool.pyrefly]
project-includes = ["src"]

# ------------------------
# === Testing settings ===
# ------------------------

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "integration: builds a real Sphinx documentation project",
]
testpaths = ["tests"]

# ------------------------------
# === Lint & Format settings ===
# ------------------------------
[tool.ruff]
line-length = 88
extend-exclude = [".pixi", "outputs", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
