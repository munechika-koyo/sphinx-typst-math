[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sphinx-typst-math"
version = "0.1.0"
description = "Render native Typst math as MathML in Sphinx HTML builds"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "sphinx-typst-math contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Sphinx :: Extension",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation :: Sphinx",
]
dependencies = [
  "Sphinx>=8.2,<10",
  "packaging>=23",
  "typst>=0.15",
]

[project.urls]
Repository = "https://github.com/munechika-koyo/sphinx-typst-math"
Issues = "https://github.com/munechika-koyo/sphinx-typst-math/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_typst_math"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: builds a real Sphinx documentation project",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".pixi", "outputs", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src/sphinx_typst_math"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sphinx.*"]
follow_imports = "skip"
